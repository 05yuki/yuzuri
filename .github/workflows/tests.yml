name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # no SGLang, no GPU: the hook helper against a stand-in module, the tables against the tree
      - run: python -m unittest discover -s tests -v
      - run: bash -n setup.sh
